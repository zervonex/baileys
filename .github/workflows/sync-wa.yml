name: Sync WA Version

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Baileys repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        working-directory: /tmp
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch WA Proto Bundle
        working-directory: /tmp
        run: |
          mkdir -p /tmp/wa-cache

          cat << 'EOF' > fetch-bundle.mjs
          import { chromium } from 'playwright'
          import { createHash } from 'crypto'
          import { writeFileSync } from 'fs'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage()

          const bundleTexts = []
          let version = 'unknown'

          const responsePromises = []

          page.on('response', (response) => {
            const url = response.url()
            if (!url.includes('.js')) return
            const p = response.text().then((text) => {
              if (url.includes('sw.js') || url.endsWith('/sw.js')) {
                const m = text.match(/client_revision[^0-9]*([0-9]+)/)
                if (m) version = m[1]
              }
              if (text.includes('internalSpec')) bundleTexts.push(text)
            }).catch(() => {})
            responsePromises.push(p)
          })

          await page.goto('https://web.whatsapp.com/', { waitUntil: 'networkidle', timeout: 120000 })
          await Promise.allSettled(responsePromises)
          await browser.close()

          if (version === 'unknown') {
            console.warn('⚠️  client_revision not found in sw.js responses')
          }

          const bundle = bundleTexts.join('\n')
          const hash = createHash('sha256').update(bundle).digest('hex')

          writeFileSync('/tmp/wa-cache/WAProto.bundle.js', bundle)
          writeFileSync('/tmp/wa-cache/wa-version.json', JSON.stringify({
            version,
            hash,
            updated: new Date().toISOString(),
          }))

          console.log(`✅ version: ${version} | scripts: ${bundleTexts.length} | hash: ${hash}`)
          EOF

          node fetch-bundle.mjs

      - name: Commit and Push to wa-cache branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin wa-cache 2>/dev/null || true
          if git rev-parse --verify origin/wa-cache > /dev/null 2>&1; then
            git checkout -B wa-cache origin/wa-cache
          else
            git checkout --orphan wa-cache
            git rm -rf . --quiet 2>/dev/null || true
          fi
          cp -r /tmp/wa-cache/. .
          git add .
          VERSION=$(node -e "process.stdout.write(require('./wa-version.json').version)")
          git diff --staged --quiet || git commit -m "chore: sync wa web bundle v${VERSION}"
          git push origin wa-cache
          echo "✅ Pushed wa-cache branch successfully"

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wa-cache /tmp/fetch-bundle.mjs /tmp/node_modules /tmp/package.json /tmp/package-lock.json