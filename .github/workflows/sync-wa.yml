name: Sync WA Version

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          cd /tmp
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch WA Proto Bundle
        run: |
          mkdir -p /tmp/wa-cache

          cat << 'EOF' > /tmp/fetch-bundle.mjs
          import { chromium } from 'playwright'
          import { createHash } from 'crypto'
          import { writeFileSync } from 'fs'

          // fetch version from sw.js directly — service workers are not
          // interceptable via page.on('response'), so we fetch it ourselves
          const swRes = await fetch('https://web.whatsapp.com/sw.js', {
            headers: {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              'Referer': 'https://web.whatsapp.com',
            },
          })
          const swText = await swRes.text()
          const versionMatch = swText.match(/client_revision[^0-9]*([0-9]+)/)
          const version = versionMatch ? versionMatch[1] : 'unknown'
          console.log(`version: ${version}`)
          if (version === 'unknown') console.warn('WARNING: client_revision not found in sw.js')

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage()

          const bundleTexts = []
          const responsePromises = []

          page.on('response', (response) => {
            const url = response.url()
            if (!url.endsWith('.js')) return
            const p = response.text().then((text) => {
              if (text.includes('internalSpec')) bundleTexts.push(text)
            }).catch(() => {})
            responsePromises.push(p)
          })

          await page.goto('https://web.whatsapp.com/', { waitUntil: 'networkidle', timeout: 120000 })
          await Promise.allSettled(responsePromises)
          await browser.close()

          if (!bundleTexts.length) {
            console.error('ERROR: no internalSpec bundles found')
            process.exit(1)
          }

          const bundle = bundleTexts.join('\n')
          const hash = createHash('sha256').update(bundle).digest('hex')

          writeFileSync('/tmp/wa-cache/WAProto.bundle.js', bundle)
          writeFileSync('/tmp/wa-cache/wa-version.json', JSON.stringify({ version, hash, updated: new Date().toISOString() }, null, 2))

          console.log(`done: ${bundleTexts.length} scripts | hash: ${hash}`)
          EOF

          cd /tmp && node fetch-bundle.mjs

      - name: Commit and Push to wa-cache branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin wa-cache 2>/dev/null || true
          if git rev-parse --verify origin/wa-cache > /dev/null 2>&1; then
            git checkout -B wa-cache origin/wa-cache
          else
            git checkout --orphan wa-cache
            git rm -rf . --quiet 2>/dev/null || true
          fi
          cp -r /tmp/wa-cache/. .
          git add .
          VERSION=$(node -e "process.stdout.write(require('./wa-version.json').version)")
          git diff --staged --quiet || git commit -m "chore: sync wa web bundle v${VERSION}"
          git push origin wa-cache
          echo "pushed wa-cache"

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wa-cache /tmp/fetch-bundle.mjs /tmp/node_modules /tmp/package.json /tmp/package-lock.json