name: Sync WA Version

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout Baileys repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Fetch WA Proto Bundle
        run: |
          mkdir -p /tmp/wa-cache

          cat << 'EOF' > fetch-bundle.mjs
          import { chromium } from 'playwright'
          import { createHash } from 'crypto'
          import { writeFileSync } from 'fs'

          const browser = await chromium.launch({ headless: true })
          const page = await browser.newPage()

          const bundles = []

          page.on('response', async (response) => {
            const url = response.url()
            if (!url.endsWith('.js')) return
            try {
              const text = await response.text()
              bundles.push(text)
            } catch {}
          })

          await page.goto('https://web.whatsapp.com/', { waitUntil: 'networkidle', timeout: 120000 })
          await browser.close()

          const bundle = bundles.join('\n')
          const hash = createHash('sha256').update(bundle).digest('hex')
          writeFileSync('/tmp/wa-cache/WAProto.bundle.js', bundle)
          writeFileSync('/tmp/wa-cache/wa-version.json', JSON.stringify({ hash, updated: new Date().toISOString() }))
          console.log(`✅ ${bundles.length} scripts, hash: ${hash}`)
          EOF

          node fetch-bundle.mjs

      - name: Commit and Push to wa-cache branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin wa-cache 2>/dev/null || true
          if git rev-parse --verify origin/wa-cache > /dev/null 2>&1; then
            git checkout -B wa-cache origin/wa-cache
          else
            git checkout --orphan wa-cache
            git rm -rf . --quiet 2>/dev/null || true
          fi
          cp -r /tmp/wa-cache/. .
          git add .
          git diff --staged --quiet || git commit -m "chore: sync wa bundle"
          git push origin wa-cache
          echo "✅ Pushed wa-cache branch successfully"

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/wa-cache fetch-bundle.mjs